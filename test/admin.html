<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NOAGE 予約管理</title><style>body{font-family:Meiryo,sans-serif;background:#eff9fc;color:#17344c;margin:0}main{max-width:900px;margin:auto;padding:20px}section,article{background:#fff;padding:20px;border-radius:14px;margin:15px 0}input,button,select,textarea{font:inherit;padding:10px;border:1px solid #b4ccd8;border-radius:8px;max-width:100%;box-sizing:border-box}button{background:#0875c7;color:white;cursor:pointer}textarea{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:10px 0}#status{white-space:pre-wrap}</style><script src="config.js" defer></script><script src="admin.js" defer></script></head><body><main><h1>NOAGE 予約管理</h1><p>管理者専用。パスワードはサーバー側で認証されます。</p><section><label>管理トークン <input id="token" type="password" autocomplete="off"></label><button id="refresh">依頼一覧を取得</button><p id="status" role="status"></p></section><section><h2>受付枠・休業日設定</h2><label>日付 <input id="date" type="date"></label><label>集荷枠 <select id="slot"></select></label><label>受付状態 <select id="state"><option>○</option><option>△</option><option>×</option></select></label><button id="save">受付枠を保存</button> <button id="closeDay">休業日に設定</button> <button id="openDay">休業日設定を解除</button><p>日曜は常に休業。祝日は休業日として登録してください。予約件数から自動で満枠にはしません。</p></section><section><h2>配送依頼一覧</h2><div id="requests">未取得</div></section><a href="index.html">公式サイトへ</a></main></body></html>
